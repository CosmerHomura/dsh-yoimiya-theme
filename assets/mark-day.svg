<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="宵宫主题标识：金鱼">
  <title>宵宫 · 金鱼（和纸昼）</title>
  <!-- 亮色档标识：和纸昼。
       几何与暗档 mark.svg 逐字一致，只换颜色——两档必须是同一条鱼，否则主题
       在明暗切换时会像换了个 logo。改动务必两份一起改。
       体型取自第一版：鱼身是【横椭圆】x2.6→17.0、y6.6→17.6（宽14.4 × 高11）。
       层序：深一档的鳍在后，身居中，身内两处径向渐变（左下受光、右上阴影）
       给体积，最后是鳃盖线与眼。 -->
  <defs>
    <clipPath id="ym-body">
      <path d="M2.6 12.1c0-3 3.2-5.5 7.2-5.5 4 0 7.2 2.5 7.2 5.5 0 3-3.2 5.5-7.2 5.5-4 0-7.2-2.5-7.2-5.5Z"/>
    </clipPath>
    <radialGradient id="ym-light" cx="24%" cy="80%" r="66%">
      <stop offset="0" stop-color="#E9A070" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#DE8A55" stop-opacity=".36"/>
      <stop offset="1" stop-color="#DE8A55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ym-shade" cx="84%" cy="14%" r="72%">
      <stop offset="0" stop-color="#5E260D" stop-opacity=".44"/>
      <stop offset=".6" stop-color="#5E260D" stop-opacity=".13"/>
      <stop offset="1" stop-color="#5E260D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 后层：背鳍与尾鳍，深一档（不画胸鳍，理由见 mark.svg） -->
  <g fill="#93401E">
    <path d="M8.8 7.6C9.7 5.9 11.0 4.9 12.7 4.8 12.0 5.7 11.6 6.6 11.4 7.6Z"/>
    <path d="M14.4 10.2C16.8 7.8 19.5 6.1 22.4 5.7 21.8 8.4 20.4 10.8 18.3 12.6 20.3 13.4 21.9 15.0 22.9 17.4 19.9 17.6 17.0 16.4 14.5 14.2Z"/>
  </g>

  <!-- 尾内两道鳍条 -->
  <g fill="none" stroke="#C97A4E" stroke-width=".55" stroke-linecap="round" opacity=".45">
    <path d="M16.0 11.0c1.6-1.0 3.1-1.8 4.7-2.2"/>
    <path d="M16.0 13.6c1.5 0.9 2.7 1.9 3.8 3.1"/>
  </g>

  <!-- 中层：鱼身（横椭圆） -->
  <path d="M2.6 12.1c0-3 3.2-5.5 7.2-5.5 4 0 7.2 2.5 7.2 5.5 0 3-3.2 5.5-7.2 5.5-4 0-7.2-2.5-7.2-5.5Z" fill="#B5502A"/>

  <!-- 前层：身内的受光与阴影，渐变收边 -->
  <g clip-path="url(#ym-body)">
    <rect x="2.4" y="6.4" width="14.8" height="11.4" fill="url(#ym-shade)"/>
    <rect x="2.4" y="6.4" width="14.8" height="11.4" fill="url(#ym-light)"/>
  </g>

  <!-- 鳃盖线 -->
  <path d="M9.2 9.2c-.9 1.1-1.3 2.2-1.3 3.4 0 1.3.4 2.4 1.3 3.4"
        fill="none" stroke="#7E3517" stroke-width=".6" stroke-linecap="round" opacity=".45"/>

  <!-- 眼：暗瞳加纸色高光，结构与暗档一致 -->
  <circle cx="6.9" cy="10.7" r="1.25" fill="#1E1410"/>
  <circle cx="6.5" cy="10.3" r="0.46" fill="#FAF3E8"/>
</svg>
